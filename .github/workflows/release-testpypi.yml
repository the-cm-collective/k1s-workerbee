name: Stage Python release candidate on TestPyPI

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified candidate to TestPyPI with OIDC
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned release tooling from one index
        run: >-
          python -m pip install
          --index-url https://pypi.org/simple
          build==1.3.0 setuptools==80.9.0 twine==6.2.0 wheel==0.45.1
      - name: Build and audit candidate A
        env:
          PYTHON_BIN: python
        run: scripts/build_release_candidate.sh --out dist/candidate-a
      - name: Build and audit candidate B
        env:
          PYTHON_BIN: python
        run: scripts/build_release_candidate.sh --out dist/candidate-b
      - name: Verify deterministic archive bytes
        run: |
          python scripts/audit_release_artifacts.py verify-manifest \
            --manifest dist/candidate-a/RELEASE-MANIFEST.json \
            --directory dist/candidate-b
          cmp dist/candidate-a/RELEASE-MANIFEST.json dist/candidate-b/RELEASE-MANIFEST.json
      - name: Upload the exact-byte candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k1s-workerbee-python-candidate
          path: dist/candidate-a/
          if-no-files-found: error
          retention-days: 14

  publish-testpypi:
    if: ${{ inputs.publish }}
    needs: build-and-validate
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/k1s-workerbee/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release verification code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download the exact-byte candidate bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: k1s-workerbee-python-candidate
          path: dist/candidate
      - name: Verify candidate identity and bytes
        run: |
          python scripts/audit_release_artifacts.py verify-project
          python scripts/audit_release_artifacts.py verify-manifest \
            --manifest dist/candidate/RELEASE-MANIFEST.json \
            --directory dist/candidate
          python scripts/audit_release_artifacts.py audit \
            dist/candidate/*.whl dist/candidate/*.tar.gz
          mkdir -p dist/publish
          cp dist/candidate/*.whl dist/candidate/*.tar.gz dist/publish/
      - name: Publish candidate to TestPyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/publish/
          attestations: false
          skip-existing: false
      - name: Verify TestPyPI serves the exact candidate bytes
        run: >-
          python scripts/audit_release_artifacts.py fetch-index
          --manifest dist/candidate/RELEASE-MANIFEST.json
          --repository-json-base https://test.pypi.org/pypi
          --output dist/testpypi-download
