name: Promote exact Python candidate to PyPI

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful TestPyPI workflow run containing the candidate artifact
        required: true
        type: string
      publish:
        description: Publish the verified candidate to PyPI with OIDC
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: pypi-production
  cancel-in-progress: false

jobs:
  verify-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release verification code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download candidate from the accepted TestPyPI run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: k1s-workerbee-python-candidate
          path: dist/candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify candidate identity, manifest, and archive hygiene
        run: |
          python scripts/audit_release_artifacts.py verify-project
          python scripts/audit_release_artifacts.py verify-manifest \
            --manifest dist/candidate/RELEASE-MANIFEST.json \
            --directory dist/candidate
          python scripts/audit_release_artifacts.py audit \
            dist/candidate/*.whl dist/candidate/*.tar.gz
      - name: Verify TestPyPI still serves the exact candidate bytes
        run: >-
          python scripts/audit_release_artifacts.py fetch-index
          --manifest dist/candidate/RELEASE-MANIFEST.json
          --repository-json-base https://test.pypi.org/pypi
          --output dist/testpypi-download
      - name: Preserve the verified promotion bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k1s-workerbee-python-production-candidate
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    if: ${{ inputs.publish }}
    needs: verify-candidate
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/k1s-workerbee/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release verification code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download the verified promotion bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: k1s-workerbee-python-production-candidate
          path: dist/candidate
      - name: Reverify exact bytes and isolate publishable files
        run: |
          python scripts/audit_release_artifacts.py verify-manifest \
            --manifest dist/candidate/RELEASE-MANIFEST.json \
            --directory dist/candidate
          mkdir -p dist/publish
          cp dist/candidate/*.whl dist/candidate/*.tar.gz dist/publish/
      - name: Require a publication-ready release contract
        run: python scripts/audit_release_artifacts.py verify-publication-ready
      - name: Publish unchanged candidate to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/publish/
          attestations: true
          skip-existing: false
      - name: Verify PyPI serves the exact promoted bytes
        run: >-
          python scripts/audit_release_artifacts.py fetch-index
          --manifest dist/candidate/RELEASE-MANIFEST.json
          --repository-json-base https://pypi.org/pypi
          --output dist/pypi-download
