[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "k1s-workerbee"
version = "1.0.2"
description = "Local MCP workbench for k1s-powered cloud-native agent testing"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "k1s contributors"}]
dependencies = [
    "k1s-core==1.0.0",
    "mcp>=1.8,<2",
]

[project.urls]
Homepage = "https://github.com/the-cm-collective/k1s-workerbee"
Repository = "https://github.com/the-cm-collective/k1s-workerbee"
Documentation = "https://github.com/the-cm-collective/k1s-workerbee/wiki"
Issues = "https://github.com/the-cm-collective/k1s-workerbee/issues"
Changelog = "https://github.com/the-cm-collective/k1s-workerbee/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.2",
    "ruff>=0.6",
    "twine>=5",
]

[project.scripts]
workerbee = "workerbee.cli:main"

[tool.workerbee.release]
distribution = "k1s-workerbee"
published-baseline-version = "0.1.7"
import-package = "workerbee"
cli-entry-point = "workerbee.cli:main"
mcp-entry-point = "workerbee.mcp_server:serve_mcp"
runtime-import = "ae"
runtime-provider-lane = "k1s-core"
runtime-provider-requirement = "k1s-core==1.0.0"
runtime-provider-artifact = "k1s_core-1.0.0-py3-none-any.whl"
runtime-provider-size = 1057377
runtime-provider-sha256 = "1208552881446eb7b4fdefd27a22ca2f79f70fb851445bebf0a17273a507724f"
runtime-provider-publication-status = "published"
forbidden-runtime-provider = "k1s-workerbee-runtime"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"workerbee.assets" = ["dashboard/*", "poc/*/*", "realtime/*/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "S"]
ignore = ["S101", "S603", "S607"]
