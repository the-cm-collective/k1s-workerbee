[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "k1s-workerbee"
version = "0.1.0.dev0"
description = "Local MCP workbench for k1s-powered cloud-native agent testing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "k1s contributors"}]
dependencies = [
    "k1s-workerbee-runtime==0.1.5.dev0",
    "mcp>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
workerbee = "workerbee.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"workerbee.assets" = ["poc/*/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ARG", "S"]
ignore = ["S101", "S603", "S607"]
