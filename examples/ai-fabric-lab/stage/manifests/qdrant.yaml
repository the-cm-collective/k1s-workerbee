apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: ai-fabric-lab
  labels:
    app: qdrant
    workerbee.k1s.dev/project: ai-fabric-lab
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.13.4
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          resources:
            requests:
              cpu: 0.5
              memory: 2Gi
            limits:
              cpu: 4
              memory: 16Gi
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-data
          hostPath:
            path: /srv/storage/k1s/ai-fabric-lab/qdrant
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: ai-fabric-lab
spec:
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
