apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: ai-models
  namespace: ai-fabric-lab
  labels:
    app: ai-models
    workerbee.k1s.dev/project: ai-fabric-lab
spec:
  image: workerbee-ai-fabric-models:dev
  imagePullPolicy: Never
  replicas: 1
  runtimeClassName: nvidia
  env:
    - name: AI_FABRIC_TRACK
      value: smoke
    - name: AI_FABRIC_CONFIG
      value: /etc/ai-fabric/model-tracks.json
    - name: HF_HOME
      value: /models/hf-cache
    - name: TRANSFORMERS_CACHE
      value: /models/hf-cache
    - name: VLLM_WORKER_MULTIPROC_METHOD
      value: spawn
  ports:
    - name: coordinator
      containerPort: 8001
    - name: expert
      containerPort: 8002
  service:
    ports:
      - name: coordinator
        port: 8001
        targetPort: 8001
      - name: expert
        port: 8002
        targetPort: 8002
  resources:
    requests:
      cpu: 6
      memory: 32Gi
      nvidia.com/gpu: "1"
    limits:
      cpu: 16
      memory: 96Gi
      nvidia.com/gpu: "1"
  volumes:
    - hostPath: /srv/storage/k1s/ai-fabric-lab/config
      mountPath: /etc/ai-fabric
      readOnly: true
    - hostPath: /srv/storage/k1s/ai-fabric-lab/models
      mountPath: /models
    - hostPath: /srv/storage/k1s/ai-fabric-lab/adapters
      mountPath: /adapters
    - hostPath: /srv/storage/k1s/ai-fabric-lab/runs
      mountPath: /runs
