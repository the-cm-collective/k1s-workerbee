apiVersion: ae.dev/v1alpha1
kind: Deployment
metadata:
  name: das-bridge
  namespace: ai-fabric-lab
  labels:
    app: das-bridge
    workerbee.k1s.dev/project: ai-fabric-lab
spec:
  image: localhost/workerbee-ai-fabric-das-bridge:dev
  imagePullPolicy: Never
  replicas: 1
  env:
    - name: AI_DAS_CONFIG_REV
      value: hyperon-das-v6
    - name: AI_DAS_BACKEND
      value: hyperon-das
    - name: MONGO_URL
      value: mongodb://mongo.ai-fabric-lab.svc.cluster.local:27017/ai_fabric
    - name: REDIS_URL
      value: redis://redis.ai-fabric-lab.svc.cluster.local:6379/0
    - name: DAS_DATA_DIR
      value: /data/das
  ports:
    - name: http
      containerPort: 8081
  service:
    port: 18181
    targetPort: 8081
  health:
    readiness:
      httpGet: { path: /healthz, port: 8081 }
      initialDelaySeconds: 2
      periodSeconds: 5
  resources:
    requests:
      cpu: 0.1
      memory: 128Mi
    limits:
      cpu: 2
      memory: 4Gi
  volumes:
    - hostPath: /srv/storage/k1s/ai-fabric-lab/das
      mountPath: /data/das
