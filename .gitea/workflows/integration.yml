name: WorkerBee integration verification

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  release-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the integration commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the pinned test runner
        run: python -m pip install --index-url https://pypi.org/simple pytest==8.4.2
      - name: Verify the host-safe release foundation
        run: >-
          python -m pytest -q -o addopts=
          tests/test_release_foundation.py
          tests/test_release_workflows.py
          tests/test_release_artifacts.py
          tests/test_installer.py
